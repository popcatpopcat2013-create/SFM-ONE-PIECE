<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>SFM ONE PIECE — Media Upload & Preview</title>
<meta name="description" content="SFM ONE PIECE — A media gallery for viewing and managing One Piece photos and videos.">
<meta property="og:title" content="SFM ONE PIECE">
<meta property="og:description" content="A media gallery for viewing and managing One Piece photos and videos.">
<meta property="og:type" content="website">
<style>
:root{
  --bg:#f5f5f7;
  --card:#fff;
  --text:#1d1d1f;
  --muted:#86868b;
  --blue:#0071e3;
  --blue-dark:#005fc4;
  --gold:#b8860b;
  --gold-dark:#96690a;
  --shadow:0 3px 14px rgba(0,0,0,.09);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;min-height:100%;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased;overscroll-behavior-y:none}
body{overflow-x:hidden}
button{font:inherit}
.container{max-width:1100px;margin:auto;padding:42px 24px 80px}
header{text-align:center;margin-bottom:34px}
header h1{margin:0 0 8px;font-size:clamp(28px,5vw,40px);letter-spacing:-.02em}
header p{margin:0;color:var(--muted);font-size:16px}
.upload-area{text-align:center;margin-bottom:34px}
.upload-buttons{display:flex;justify-content:center;gap:12px;flex-wrap:wrap}
.upload-btn{border:0;border-radius:999px;padding:15px 28px;background:var(--blue);color:white;font-weight:650;font-size:17px;display:inline-flex;align-items:center;gap:10px;cursor:pointer;box-shadow:0 5px 18px rgba(0,113,227,.28);transition:.15s transform}
.upload-btn.video{background:#333;box-shadow:0 5px 18px rgba(0,0,0,.18)}
.upload-btn:active{transform:scale(.96)}
.upload-btn svg{width:20px;height:20px}
.count-label{display:block;color:var(--muted);font-size:15px;margin:17px 0 14px;min-height:18px}
.actions{display:flex;justify-content:center;align-items:center;gap:10px;flex-wrap:wrap}
.action-btn{border:1.5px solid var(--blue);background:white;color:var(--blue);border-radius:999px;padding:9px 15px;display:inline-flex;align-items:center;gap:8px;font-weight:600;cursor:pointer}
.action-btn.video{border-color:#333;color:#333}
.action-btn:active{transform:scale(.96)}
.action-btn svg{width:17px;height:17px}
#publicActions .action-btn{border-color:var(--gold);color:var(--gold-dark)}
#publicActions .action-btn.video{border-color:var(--gold);color:var(--gold-dark)}
#publicActions .action-btn:hover{background:#fdf8ef}
.teaser-strip{display:flex;justify-content:center;gap:14px;flex-wrap:wrap;margin-top:40px;padding:0 20px;opacity:0;transition:opacity .6s ease}
.teaser-strip.show{opacity:1}
.teaser-strip img{width:104px;height:104px;object-fit:cover;border-radius:16px;box-shadow:0 8px 22px rgba(0,0,0,.14);transition:transform .2s ease,filter .25s ease;background:#e5e5e7;filter:blur(3px) saturate(1.05)}
.teaser-strip img:nth-child(2n){transform:rotate(-3deg)}
.teaser-strip img:nth-child(2n+1){transform:rotate(2.5deg)}
@media(hover:hover){.teaser-strip img:hover{transform:scale(1.08) rotate(0deg);position:relative;z-index:2;filter:blur(0) saturate(1.05)}}
@media(max-width:600px){.teaser-strip{gap:10px;margin-top:28px}.teaser-strip img{width:70px;height:70px;border-radius:12px;filter:blur(2px) saturate(1.05)}}
.clear-btn{border:0;background:none;color:var(--blue);font-weight:600;cursor:pointer;padding:8px}
.empty-state{border:2px dashed rgba(0,0,0,.1);border-radius:20px;padding:70px 20px;text-align:center;color:var(--muted)}
.empty-state svg{width:45px;height:45px;opacity:.4;margin-bottom:12px}
.empty-state p{margin:0}
.media-section{display:none;margin-top:38px}
.media-section.show{display:block}
.media-section h2{font-size:25px;margin:0 0 17px;letter-spacing:-.02em}
.gallery{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}
.card{position:relative;border-radius:17px;overflow:hidden;box-shadow:var(--shadow);background:#ddd;animation:in .28s ease both}
.card.image-card{aspect-ratio:1}
.card.video-card{aspect-ratio:16/9;cursor:default;background:#111}
.card img,.card video{display:block;width:100%;height:100%;object-fit:cover}
.card img{background:#ddd}
.card video{background:#111;pointer-events:none}
@keyframes in{from{opacity:0;transform:scale(.9)}to{opacity:1;transform:scale(1)}}
.delete-btn,.favorite-btn{position:absolute;top:9px;width:31px;height:31px;border:0;border-radius:50%;background:rgba(0,0,0,.48);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);color:white;display:flex;align-items:center;justify-content:center;padding:0;z-index:5;cursor:pointer}
.delete-btn{right:9px}.favorite-btn{left:9px}
.delete-btn svg,.favorite-btn svg{width:16px;height:16px}
.favorite-btn.active svg{fill:currentColor}
.delete-btn:active,.favorite-btn:active{transform:scale(.84)}
.play-badge{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:52px;height:52px;border-radius:50%;background:rgba(0,0,0,.58);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);color:white;display:flex;align-items:center;justify-content:center;z-index:3;pointer-events:none}
.play-badge svg{width:22px;height:22px;margin-left:3px}

/* Preview overlay */
.preview-overlay{position:fixed;inset:0;z-index:1000;background:var(--bg);transform:translateY(100%);transition:transform .3s cubic-bezier(.22,1,.36,1);overflow:auto;-webkit-overflow-scrolling:touch}
.preview-overlay.open{transform:translateY(0)}
.preview-header{position:sticky;top:0;z-index:20;height:70px;display:flex;align-items:center;justify-content:space-between;padding:0 24px;background:rgba(245,245,247,.88);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-bottom:1px solid rgba(0,0,0,.08)}
.preview-header h2{font-size:21px;margin:0}
.done-btn{border:0;background:none;color:var(--blue);font-size:17px;font-weight:650;cursor:pointer}

/* Images = JS-computed masonry (absolute positioned once each image's size is known) */
.preview-images-grid{position:relative;padding:24px;transition:opacity .2s ease}
.preview-images-grid .preview-card{position:absolute;top:0;left:0;border-radius:17px;overflow:hidden;box-shadow:var(--shadow);background:#ddd;cursor:pointer}
.preview-images-grid img{display:block;width:100%;height:auto}

/* Videos = real grid, never columns */
.preview-videos-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px;padding:24px;align-items:start}
.preview-videos-grid .preview-card{position:relative;width:100%;aspect-ratio:16/9;border-radius:17px;overflow:hidden;background:#111;box-shadow:var(--shadow);cursor:pointer}
.preview-videos-grid video{display:block;width:100%;height:100%;object-fit:cover;background:#111;pointer-events:none;cursor:default}

/* Favorite preview can contain both types */
.preview-favorites-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:20px;padding:24px;align-items:start}
.preview-favorites-grid .preview-card{position:relative;border-radius:17px;overflow:hidden;background:#ddd;box-shadow:var(--shadow);cursor:pointer}
.preview-favorites-grid .preview-card.image{aspect-ratio:1}
.preview-favorites-grid .preview-card.video{aspect-ratio:16/9;background:#111}
.preview-favorites-grid img,.preview-favorites-grid video{width:100%;height:100%;display:block;object-fit:cover}

.preview-heart{position:absolute;top:10px;right:10px;width:32px;height:32px;border-radius:50%;background:rgba(0,0,0,.5);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);color:white;display:flex;align-items:center;justify-content:center;z-index:4;pointer-events:none}
.preview-heart svg{width:17px;height:17px;fill:currentColor}
.preview-empty{grid-column:1/-1;text-align:center;color:var(--muted);padding:80px 20px;font-size:16px}
.preview-empty .big{font-size:44px;margin-bottom:10px}

/* Large image/video viewer */
.viewer{position:fixed;inset:0;z-index:2000;background:rgba(0,0,0,.58);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);display:flex;align-items:center;justify-content:center;padding:22px;opacity:0;visibility:hidden;pointer-events:none;transition:opacity .2s,visibility .2s;touch-action:auto}
.viewer.open{opacity:1;visibility:visible;pointer-events:auto}
.viewer-inner{position:relative;width:fit-content;max-width:94vw;max-height:90vh;display:flex;align-items:center;justify-content:center;gap:24px;transform:scale(.9);opacity:0;transition:transform .24s cubic-bezier(.2,.8,.2,1),opacity .2s;box-sizing:border-box}
.viewer.open .viewer-inner{transform:scale(1);opacity:1}
.viewer img{display:block;max-width:calc(94vw - 344px);max-height:88vh;width:auto;height:auto;object-fit:contain;border-radius:18px;box-shadow:0 20px 70px rgba(0,0,0,.45);user-select:none;-webkit-user-drag:none}
.viewer video{display:block;max-width:calc(94vw - 344px);max-height:88vh;width:auto;height:auto;object-fit:contain;border-radius:18px;background:#000;box-shadow:0 20px 70px rgba(0,0,0,.45);pointer-events:auto}.viewer-video-holder{display:flex;align-items:center;justify-content:center;max-width:94vw;max-height:88vh;pointer-events:auto}
.viewer-close{position:absolute;top:-12px;right:-12px;width:36px;height:36px;border:0;border-radius:50%;background:rgba(45,45,45,.82);color:white;display:flex;align-items:center;justify-content:center;z-index:10;cursor:pointer}
.viewer-close svg{width:18px;height:18px}
.viewer-heart{position:absolute;left:12px;bottom:12px;width:40px;height:40px;border-radius:50%;background:rgba(0,0,0,.58);color:white;display:flex;align-items:center;justify-content:center;z-index:10;pointer-events:none}
.viewer-heart svg{width:21px;height:21px;fill:currentColor}
/* Description panel: appears only when a description exists, or to the signed-in admin for editing */
.viewer-description{display:none;position:relative;width:min(320px,24vw);max-height:78vh;margin-left:0;padding:22px 22px 20px;border-radius:18px;background:rgba(24,24,24,.78);color:#fff;box-shadow:0 20px 70px rgba(0,0,0,.35);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);overflow:auto;flex:0 0 auto}
.viewer.has-description .viewer-description{display:block}
.viewer-description-title{margin:0 0 10px;font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:rgba(255,255,255,.62)}
.viewer-description-text{margin:0;white-space:pre-wrap;word-break:break-word;font-size:16px;line-height:1.55;color:#fff}
.viewer-description-empty{color:rgba(255,255,255,.55);font-size:15px;line-height:1.5}
.viewer-description-actions{display:flex;gap:8px;margin-top:16px}
.viewer-description-btn{border:0;border-radius:999px;padding:8px 13px;font-size:14px;font-weight:650;cursor:pointer}
.viewer-description-edit{background:#fff;color:#111}
.viewer-description-save{background:#fff;color:#111}
.viewer-description-cancel{background:rgba(255,255,255,.12);color:#fff}
.viewer-description-editor{display:none;width:100%;min-height:150px;resize:vertical;border:1px solid rgba(255,255,255,.18);border-radius:12px;background:rgba(0,0,0,.28);color:#fff;padding:12px;font:inherit;font-size:15px;line-height:1.5;outline:none}
.viewer-description.editing .viewer-description-text,.viewer-description.editing .viewer-description-empty{display:none}
.viewer-description.editing .viewer-description-editor{display:block}
.viewer-description.editing .viewer-description-actions{display:flex}
.viewer-description.editing .viewer-description-edit{display:none}
.viewer-description:not(.editing) .viewer-description-save,.viewer-description:not(.editing) .viewer-description-cancel{display:none}

.swipe-left{animation:swipeLeft .22s ease}.swipe-right{animation:swipeRight .22s ease}
@keyframes swipeLeft{0%{transform:translateX(0) scale(1);opacity:1}45%{transform:translateX(-25px) scale(.97);opacity:.45}100%{transform:translateX(0) scale(1);opacity:1}}
@keyframes swipeRight{0%{transform:translateX(0) scale(1);opacity:1}45%{transform:translateX(25px) scale(.97);opacity:.45}100%{transform:translateX(0) scale(1);opacity:1}}

@media(max-width:850px){
  .gallery{grid-template-columns:repeat(3,minmax(0,1fr))}
  .preview-favorites-grid{grid-template-columns:repeat(3,minmax(0,1fr))}
  .preview-videos-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media(max-width:600px){
  .container{padding:30px 15px 60px}
  .upload-btn{padding:14px 22px;font-size:16px}
  .gallery{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
  .media-section{margin-top:30px}
  .media-section h2{font-size:22px}
  .preview-header{height:62px;padding:0 16px}
  .preview-videos-grid{grid-template-columns:1fr 1fr;gap:12px;padding:16px}
  .preview-favorites-grid{grid-template-columns:1fr 1fr;gap:12px;padding:16px}
  .viewer{padding:14px}
  .viewer img,.viewer video{max-width:96vw;max-height:84vh}
}

/* ===== Auth screen ===== */
.auth-screen{position:fixed;inset:0;z-index:3000;display:flex;align-items:center;justify-content:center;padding:24px;background:var(--bg)}
.auth-card{width:100%;max-width:380px;background:rgba(255,255,255,.85);border:1px solid rgba(0,0,0,.06);border-radius:28px;padding:34px 28px;box-shadow:0 10px 35px rgba(0,0,0,.08);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);text-align:center}
.auth-card h1{font-size:26px;font-weight:700;letter-spacing:-.03em;margin:0 0 6px}
.auth-card p.auth-sub{margin:0 0 22px;color:#7b7b80;font-size:14px}
.auth-field{display:block;width:100%;border:1px solid rgba(0,0,0,.12);background:#fff;border-radius:13px;padding:13px 14px;font-size:16px;font-family:inherit;margin-bottom:10px}
.auth-field:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px rgba(0,113,227,.15)}
.auth-submit{width:100%;border:0;border-radius:16px;padding:14px;background:#111;color:#fff;font-size:16px;font-weight:650;cursor:pointer;margin-top:4px;transition:transform .16s ease,opacity .16s ease}
.auth-submit:active{transform:scale(.98)}
.auth-submit:disabled{opacity:.55;cursor:default;transform:none}
.auth-toggle{display:block;width:100%;border:0;background:none;color:var(--blue);font-size:14px;font-weight:600;cursor:pointer;padding:14px 0 0;font-family:inherit}
.auth-error{min-height:18px;color:#d3242f;font-size:13px;font-weight:600;margin:10px 0 0}
.sign-out-btn,.login-btn{position:fixed;top:16px;right:16px;z-index:50;border:1px solid rgba(0,0,0,.1);background:rgba(255,255,255,.82);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);color:#6c6c72;font-size:13px;font-weight:650;font-family:inherit;padding:9px 15px;border-radius:999px;cursor:pointer;box-shadow:0 3px 10px rgba(0,0,0,.06)}
.sign-out-btn:active,.login-btn:active{transform:scale(.95)}

/* ---------- small helpers ---------- */
function withTimeout(promise,ms,message){
  return new Promise(function(resolve,reject){
    var done=false;
    var timer=setTimeout(function(){
      if(done)return;done=true;
      reject(new Error(message||'Request timed out. Please try again.'));
    },ms);
    promise.then(
      function(v){if(done)return;done=true;clearTimeout(timer);resolve(v)},
      function(e){if(done)return;done=true;clearTimeout(timer);reject(e)}
    );
  });
}
function safeExt(name){
  var m=/\.[a-zA-Z0-9]{1,5}$/.exec(name||'');
  return m?m[0]:'';
}
function newFileId(){
  return (window.crypto&&crypto.randomUUID)?crypto.randomUUID():(Date.now()+'-'+Math.random().toString(16).slice(2));
}
function setEmptyStateText(text){
  var p=emptyState.querySelector('p');

}

/* ---------- cloud persistence (Supabase Storage + Database) ---------- */
async function cloudPut(item){
  var path=currentUser.id+'/'+newFileId()+safeExt(item.name);
  var up=await sb.storage.from(BUCKET).upload(path,item.blob,{contentType:item.blob.type||undefined});
  if(up.error)throw up.error;
  var ins=await sb.from('media_items').insert({
    user_id:currentUser.id,type:item.type,name:item.name||null,
    favorite:false,storage_path:path,description:item.description||null
  }).select().single();
  if(ins.error){
    sb.storage.from(BUCKET).remove([path]).catch(function(){});
    throw ins.error;
  }
  item.id=ins.data.id;
  item.storagePath=path;
}
async function cloudSetFavorite(item){
  return sb.from('media_items').update({favorite:!!item.favorite}).eq('id',item.id);
}
async function cloudSetDescription(item,description){
  return sb.from('media_items').update({description:description||null}).eq('id',item.id);
}
async function cloudDelete(item){
  if(item.storagePath)await sb.storage.from(BUCKET).remove([item.storagePath]);
  if(typeof item.id==='number')await sb.from('media_items').delete().eq('id',item.id);
}
async function cloudClearAll(){
  var paths=items.map(function(x){return x.storagePath}).filter(Boolean);
  if(paths.length)await sb.storage.from(BUCKET).remove(paths);
  if(currentUser)await sb.from('media_items').delete().eq('user_id',currentUser.id);
}
async function loadGallery(){
  setEmptyStateText('Loading your gallery…');
  emptyState.style.display='block';
  try{
    var res=await sb.from('media_items').select('*').order('id',{ascending:true});
    if(res.error)throw res.error;
    var rows=res.data||[];
    var results=await Promise.all(rows.map(function(row){
      return sb.storage.from(BUCKET).createSignedUrl(row.storage_path,6*60*60).then(function(signed){
        return {row:row,signed:signed};
      });
    }));
    var loaded=[];
    results.forEach(function(r){
      if(r.signed.error){console.error(r.signed.error);return}
      var row=r.row;
      loaded.push({id:row.id,type:row.type,blob:null,name:row.name,description:row.description||'',favorite:!!row.favorite,storagePath:row.storage_path,url:r.signed.data.signedUrl,thumbnail:''});
    });
    items=loaded;
    setEmptyStateText('No photos or videos yet');
  }catch(err){
    console.error('Cloud load error:',err);
    setEmptyStateText("Couldn't load the gallery. Please refresh the page.");
  }
  rebuildMain();
}

/* Create a real thumbnail from the video's first usable frame.
   This prevents the preview grid from being nothing but black boxes. */
function makeVideoThumbnail(item){
  if(item.thumbnail)return Promise.resolve(item.thumbnail);
  return new Promise(function(resolve){
    var v=document.createElement('video');
    var url=getURL(item);
    var done=false;
    function finish(value){if(done)return;done=true;v.removeAttribute('src');v.load();resolve(value||'')}
    v.muted=true;v.playsInline=true;v.preload='metadata';v.src=url;
    v.addEventListener('loadeddata',function(){
      try{
        var c=document.createElement('canvas');
        var w=v.videoWidth||640,h=v.videoHeight||360;
        var max=960,scale=Math.min(1,max/w);
        c.width=Math.max(1,Math.round(w*scale));c.height=Math.max(1,Math.round(h*scale));
        c.getContext('2d').drawImage(v,0,0,c.width,c.height);
        item.thumbnail=c.toDataURL('image/jpeg',.82);
        finish(item.thumbnail);
      }catch(e){finish('')}
    },{once:true});
    v.addEventListener('error',function(){finish('')},{once:true});
    setTimeout(function(){finish(item.thumbnail||'')},3500);
  });
}

function createMainCard(item,index){

  if(isImage(item)){
    var img=document.createElement('img');img.src=getURL(item);img.alt=item.name||'Uploaded image';img.draggable=false;
    card.appendChild(img);
    imageGallery.appendChild(card);
  }else{
    var v=document.createElement('video');v.src=getURL(item);v.muted=true;v.playsInline=true;v.preload='metadata';
    card.appendChild(v);card.appendChild(playBadge());
    videoGallery.appendChild(card);
    makeVideoThumbnail(item).then(function(src){if(src){card.style.backgroundImage='url("'+src+'")';card.style.backgroundSize='cover';card.style.backgroundPosition='center'}});
  }
  card.appendChild(makeHeartButton(item));
  card.appendChild(makeDeleteButton(item));
}

function rebuildMain(){
  imageGallery.innerHTML='';videoGallery.innerHTML='';
  items.forEach(function(item,i){createMainCard(item,i)});
  updateUI();
}
function updateUI(){
  var count=items.length;
  var imageCount=items.filter(isImage).length;
  var videoCount=items.filter(isVideo).length;
  var favCount=items.filter(function(x){return x.favorite}).length;
  emptyState.style.display=count?'none':'block';
  imageSection.classList.toggle('show',imageCount>0);
  videoSection.classList.toggle('show',videoCount>0);
  countLabel.textContent=count?(count+' '+(count===1?'item':'items')+' selected'):'';
  previewImages.hidden=imageCount===0;
  previewVideos.hidden=videoCount===0;
  previewFavorites.hidden=favCount===0;
  clearAll.hidden=count===0;
  updateTeaserStrip();
}

function updateTeaserStrip(){
  var teaserStrip=document.getElementById('teaserStrip');
  if(!teaserStrip)return;
  var images=items.filter(isImage);
  if(!images.length){teaserStrip.classList.remove('show');teaserStrip.innerHTML='';return}
  var favs=images.filter(function(x){return x.favorite});
  var rest=images.filter(function(x){return !x.favorite});
  var pick=favs.concat(rest).slice(0,6);
  teaserStrip.innerHTML='';
  pick.forEach(function(item){
    var img=document.createElement('img');
    img.src=getURL(item);img.alt='';img.draggable=false;
    teaserStrip.appendChild(img);
  });
  requestAnimationFrame(function(){teaserStrip.classList.add('show')});
}

function toggleFavorite(id){
  var item=items.find(function(x){return x.id===id});
  if(!item)return;
  item.favorite=!item.favorite;
  cloudSetFavorite(item).catch(console.error);
  rebuildMain();
  if(previewOverlay.classList.contains('open'))renderPreview(previewMode);
  if(viewer.classList.contains('open')&&viewerIndex!==-1){viewerHeart.style.display=item.favorite?'flex':'none'}
}

function removeItem(id){
  var index=items.findIndex(function(x){return x.id===id});
  if(index<0)return;
  var item=items[index];
  if(viewerIndex!==-1&&items[viewerIndex]&&items[viewerIndex].id===id)closeViewerNow();
  items.splice(index,1);
  if(item.url)URL.revokeObjectURL(item.url);
  cloudDelete(item).catch(console.error);
  rebuildMain();
  if(previewOverlay.classList.contains('open')){
    if(!items.length)closePreview();else renderPreview(previewMode);
  }
}

function getPreviewIndices(mode){
  var result=[];
  items.forEach(function(item,index){
    var ok=mode==='images'?isImage(item):mode==='videos'?isVideo(item):item.favorite;
    if(ok)result.push(index);
  });
  return result;
}

function renderPreview(mode){
  previewGrid.innerHTML='';
  previewGrid.className='';
  previewGrid.style.height='';
  previewGrid.style.opacity='';
  var shown=getPreviewIndices(mode).map(function(index){return {item:items[index],index:index}});

  if(mode==='images')previewGrid.className='preview-images-grid';
  else if(mode==='videos')previewGrid.className='preview-videos-grid';
  else previewGrid.className='preview-favorites-grid';

  if(!shown.length){
    var empty=document.createElement('div');empty.className='preview-empty';
    empty.innerHTML='<div class="big">'+(mode==='videos'?'▶':mode==='images'?'▧':'♡')+'</div><div>No '+(mode==='videos'?'videos':mode==='images'?'images':'favorite items')+' yet</div>';
    previewGrid.appendChild(empty);return;
  }

  var loadPromises=[];

  shown.forEach(function(entry){
    var item=entry.item,index=entry.index;
    var card=document.createElement('div');card.dataset.id=item.id;
    card.className='preview-card '+(isVideo(item)?'video':'image');
    if(isImage(item)){
      var img=document.createElement('img');img.src=getURL(item);img.alt=item.name||'Image';img.draggable=false;
      card.appendChild(img);
      if(mode==='images'){
        loadPromises.push(new Promise(function(resolve){
          if(img.complete&&img.naturalWidth){resolve();return}
          img.addEventListener('load',resolve,{once:true});
          img.addEventListener('error',resolve,{once:true});
        }));
      }
    }else{
      var v=document.createElement('video');v.src=getURL(item);v.muted=true;v.playsInline=true;v.preload='metadata';v.setAttribute('aria-label',item.name||'Video');
      card.appendChild(v);card.appendChild(playBadge());
      makeVideoThumbnail(item).then(function(src){if(src){card.style.backgroundImage='url("'+src+'")';card.style.backgroundSize='cover';card.style.backgroundPosition='center'}});
    }
    if(item.favorite){
      var heart=document.createElement('div');heart.className='preview-heart';heart.innerHTML=heartSVG();card.appendChild(heart);
    }
    card.addEventListener('click',function(){openViewer(index,mode)});
    previewGrid.appendChild(card);
  });

  if(mode==='images'){
    previewGrid.style.opacity='0';
    var safetyTimeout=new Promise(function(resolve){setTimeout(resolve,4000)});
    Promise.race([Promise.all(loadPromises),safetyTimeout]).then(function(){
      layoutImagesMasonry();
      previewGrid.style.opacity='1';
    });
  }
}

function layoutImagesMasonry(){
  var container=previewGrid;
  if(!container.classList.contains('preview-images-grid'))return;
  var cards=Array.prototype.slice.call(container.children).filter(function(el){return el.classList&&el.classList.contains('preview-card')});
  if(!cards.length)return;
  var gap=window.innerWidth<=600?11:18;
  var minColWidth=window.innerWidth<=600?150:240;
  var containerWidth=container.clientWidth;
  var colCount=Math.max(1,Math.floor((containerWidth+gap)/(minColWidth+gap)));
  var colWidth=(containerWidth-(colCount-1)*gap)/colCount;
  var colHeights=new Array(colCount).fill(0);
  cards.forEach(function(card){
    var minCol=0;
    for(var i=1;i<colCount;i++){if(colHeights[i]<colHeights[minCol])minCol=i}
    var x=minCol*(colWidth+gap);
    var y=colHeights[minCol];
    card.style.width=colWidth+'px';
    card.style.left=x+'px';
    card.style.top=y+'px';
    var h=card.offsetHeight;
    colHeights[minCol]=y+h+gap;
  });
  container.style.height=Math.max.apply(null,colHeights)+'px';
}

var masonryResizeTimer=null;
window.addEventListener('resize',function(){
  if(!previewOverlay.classList.contains('open'))return;
  if(!previewGrid.classList.contains('preview-images-grid'))return;
  clearTimeout(masonryResizeTimer);
  masonryResizeTimer=setTimeout(layoutImagesMasonry,150);
});



function openPreview(mode){
  if(mode==='images'&&!items.some(isImage))return;
  if(mode==='videos'&&!items.some(isVideo))return;
  if(mode==='favorites'&&!items.some(function(x){return x.favorite}))return;
  previewMode=mode;
  previewTitle.textContent=mode==='images'?'Preview Images':mode==='videos'?'Preview Videos':'Preview Favorite';
  renderPreview(mode);
  previewOverlay.classList.add('open');
  previewOverlay.scrollTop=0;
  document.body.style.overflow='hidden';
  if('inert' in mainContainer)mainContainer.inert=true;
  donePreview.focus();
}
function closePreview(){
  previewOverlay.classList.remove('open');
  document.body.style.overflow='';
  if('inert' in mainContainer)mainContainer.inert=false;
  previewMode='';
}

function resetDescriptionEditor(){
  viewerDescription.classList.remove('editing');
  viewerDescriptionEditor.value='';
}
function renderViewerDescription(item){
  var description=(item&&item.description?String(item.description):'').trim();
  var isAdmin=!!currentUser;
  viewerDescriptionText.textContent=description;
  viewerDescriptionEmpty.style.display=description?'none':'block';
  viewerDescriptionText.style.display=description?'block':'none';
  viewerDescriptionEditor.value=description;
  viewerDescription.classList.toggle('has-content',!!description);
  viewerDescription.classList.toggle('admin-editable',isAdmin);
  viewerDescription.style.display=(description||isAdmin)?'block':'none';
  editDescription.style.display=isAdmin?'inline-flex':'none';
  resetDescriptionEditor();
  viewer.classList.toggle('has-description',!!description||isAdmin);
}
function startDescriptionEdit(){
  if(!currentUser||viewerIndex===-1)return;
  var item=items[viewerIndex];
  if(!item)return;
  viewerDescriptionEditor.value=item.description||'';
  viewerDescription.classList.add('editing');
  viewerDescriptionEditor.focus();
}
async function saveViewerDescription(){
  if(!currentUser||viewerIndex===-1)return;
  var item=items[viewerIndex];
  if(!item)return;
  var value=viewerDescriptionEditor.value.trim();
  var oldValue=item.description||'';
  item.description=value;
  saveDescription.disabled=true;
  saveDescription.textContent='Saving…';
  try{
    var res=await cloudSetDescription(item,value);
    if(res.error)throw res.error;
    renderViewerDescription(item);
  }catch(err){
    item.description=oldValue;
    console.error(err);
    alert('Could not save the description. Please try again.');
    renderViewerDescription(item);
  }finally{
    saveDescription.disabled=false;
    saveDescription.textContent='Save';
  }
}
function cancelDescriptionEdit(){
  if(viewerIndex===-1)return;
  renderViewerDescription(items[viewerIndex]);
}
function clearViewerMedia(){
  viewerImage.style.display='none';viewerImage.removeAttribute('src');
  while(viewerVideoHolder.firstChild){
    var old=viewerVideoHolder.firstChild;
    if(old.pause)old.pause();
    viewerVideoHolder.removeChild(old);
  }
}
function openViewer(index,mode){
  if(index<0||index>=items.length)return;
  mode=mode||previewMode;
  viewerList=getPreviewIndices(mode);
  viewerPos=viewerList.indexOf(index);
  if(viewerPos===-1)return;
  viewerIndex=index;
  var item=items[index];
  clearViewerMedia();
  renderViewerDescription(item);
  viewerHeart.style.display=item.favorite?'flex':'none';
  if(isImage(item)){
    viewerImage.src=getURL(item);viewerImage.style.display='block';
  }else{
    var v=document.createElement('video');v.src=getURL(item);v.controls=true;v.playsInline=true;v.preload='metadata';v.autoplay=false;
    viewerVideoHolder.className='viewer-video-holder';viewerVideoHolder.appendChild(v);
  }
  viewer.classList.add('open');
  closeViewer.focus();
}
function openViewerById(id){
  var index=items.findIndex(function(x){return x.id===id});
  if(index!==-1)openViewer(index);
}
function closeViewerNow(){
  viewer.classList.remove('open','has-description');
  viewerDescription.style.display='none';
  resetDescriptionEditor();
  clearViewerMedia();
  viewerIndex=-1;
  viewerList=[];
  viewerPos=-1;
}
function closeViewerSafe(){closeViewerNow()}
function changeViewer(direction){
  if(viewerIndex===-1||viewerPos===-1||!viewerList.length)return;
  var nextPos=viewerPos+direction;
  if(nextPos<0||nextPos>=viewerList.length)return;
  var nextIndex=viewerList[nextPos];
  viewerInner.classList.remove('swipe-left','swipe-right');
  void viewerInner.offsetWidth;
  viewerInner.classList.add(direction>0?'swipe-left':'swipe-right');
  openViewer(nextIndex,previewMode);
}

viewer.addEventListener('touchstart',function(e){
  if(!viewer.classList.contains('open')||e.touches.length!==1)return;
  if(e.target.closest && (e.target.closest('video')||e.target.closest('button')))return;
  touchX=e.touches[0].clientX;touchY=e.touches[0].clientY;touchTime=Date.now();
},{passive:true});
viewer.addEventListener('touchend',function(e){
  if(!viewer.classList.contains('open')||e.changedTouches.length!==1)return;
  if(e.target.closest && (e.target.closest('video')||e.target.closest('button')))return;
  var dx=e.changedTouches[0].clientX-touchX;
  var dy=e.changedTouches[0].clientY-touchY;
  var elapsed=Date.now()-touchTime;
  if(Math.abs(dx)>Math.abs(dy)*1.25&&Math.abs(dx)>=55&&elapsed<=700)changeViewer(dx<0?1:-1);
  touchX=touchY=touchTime=0;
},{passive:true});

document.addEventListener('keydown',function(e){
  if(videoLimitModal.classList.contains('open')&&e.key==='Escape'){e.preventDefault();closeVideoLimitWarning();return;}
  if(viewer.classList.contains('open')){
    if(e.key==='ArrowLeft'){e.preventDefault();changeViewer(-1)}
    else if(e.key==='ArrowRight'){e.preventDefault();changeViewer(1)}
    else if(e.key==='Escape'){e.preventDefault();closeViewerSafe()}
  }else if(previewOverlay.classList.contains('open')&&e.key==='Escape')closePreview();
});

viewer.addEventListener('click',function(e){if(e.target===viewer)closeViewerSafe()});
viewerInner.addEventListener('click',function(e){e.stopPropagation()});
closeViewer.addEventListener('click',closeViewerSafe);
editDescription.addEventListener('click',startDescriptionEdit);
saveDescription.addEventListener('click',saveViewerDescription);
cancelDescription.addEventListener('click',cancelDescriptionEdit);
chooseImages.addEventListener('click',function(){imageInput.click()});
chooseVideos.addEventListener('click',function(){videoInput.click()});
previewImages.addEventListener('click',function(){openPreview('images')});
previewVideos.addEventListener('click',function(){openPreview('videos')});
previewFavorites.addEventListener('click',function(){openPreview('favorites')});
donePreview.addEventListener('click',closePreview);

async function addFiles(files,type){
  var batch=[];
  for(var i=0;i<files.length;i++){
    var file=files[i];
    if(type==='video'&&file.size>MAX_VIDEO_SIZE){
      showVideoLimitWarning(file);
      continue;
    }
    var item={id:'tmp-'+newFileId(),type:type,blob:file,name:file.name,description:'',favorite:false,url:URL.createObjectURL(file),thumbnail:''};
    items.push(item);
    batch.push(item);
  }
  rebuildMain();
  for(var j=0;j<batch.length;j++){
    try{
      await cloudPut(batch[j]);
    }catch(err){
      console.error(err);
      alert('Upload failed for "'+(batch[j].name||'file')+'": '+(err&&err.message?err.message:err));
      var idx=items.indexOf(batch[j]);
      if(idx!==-1)items.splice(idx,1);
      if(batch[j].url)URL.revokeObjectURL(batch[j].url);
    }
  }
  rebuildMain();
}
imageInput.addEventListener('change',function(e){addFiles(Array.prototype.slice.call(e.target.files||[]),'image');imageInput.value=''});
videoInput.addEventListener('change',function(e){addFiles(Array.prototype.slice.call(e.target.files||[]),'video');videoInput.value=''});

clearAll.addEventListener('click',async function(){
  items.forEach(function(x){if(x.url)URL.revokeObjectURL(x.url)});
  items=[];imageGallery.innerHTML='';videoGallery.innerHTML='';
  closeViewerNow();closePreview();
  try{await cloudClearAll()}catch(err){console.error(err)}
  updateUI();
});

})();
</script>
</body>
